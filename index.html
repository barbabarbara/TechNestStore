<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechNest | Home</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Website navigation -->
    <header class="site-header">
      <div class="container">
        <a href="./index.html" class="logo"> TechNest </a>

        <nav aria-label="Main navigation">
          <a href="./index.html" aria-current="page"> Home </a>
          <a href="#categories">Categories</a>
        </nav>
      </div>
    </header>

    <!-- Main page content -->
    <main>
      <section class="hero container">
        <h1>Everyday tech, made simple.</h1>

        <p>Discover smartphones, laptops, tablets, and accessories.</p>

        <button id="browse-button" type="button">Browse categories</button>
      </section>

      <!-- Product categories -->
      <section id="categories" class="container">
        <h2>Shop by category</h2>

        <div class="category-grid">
          <article>Smartphones</article>
          <article>Laptops</article>
          <article>Tablets</article>
          <article>Mobile accessories</article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 TechNest — Student project</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
