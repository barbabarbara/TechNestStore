<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="title desc">
  <title id="title">TechNest product image placeholder</title>
  <desc id="desc">Minimal illustration of a laptop and smartphone on a light grey background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#edf1f5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce9fc"/>
      <stop offset="1" stop-color="#91b7eb"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbdaf7"/>
      <stop offset="1" stop-color="#7299df"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="30" fill="url(#background)"/>
  <circle cx="319" cy="205" r="146" fill="#e6ebf3"/>
  <circle cx="319" cy="205" r="113" fill="#f1f4f9" opacity=".75"/>
  <ellipse cx="310" cy="349" rx="170" ry="18" fill="#aeb7c5" opacity=".15"/>
  <!-- Laptop: a neutral electronics silhouette. -->
  <rect x="159" y="166" width="290" height="171" rx="14" fill="#2c3443"/>
  <rect x="168" y="175" width="272" height="153" rx="7" fill="url(#screen)"/>
  <path d="M173 295C221 247 253 258 301 279C344 297 383 265 438 236V327H173Z" fill="#7099df" opacity=".30"/>
  <path d="M145 338H465L447 349H163Z" fill="#85909e"/>
  <path d="M145 338H465L459 342H150Z" fill="#c5cbd3"/>
  <path d="M281 338H330L324 342H287Z" fill="#a0a9b5"/>
  <!-- Smartphone in front of the laptop. -->
  <g transform="rotate(8 430 229)">
    <rect x="385" y="134" width="89" height="186" rx="19" fill="#252e3e"/>
    <rect x="392" y="143" width="75" height="167" rx="13" fill="url(#phone)"/>
    <path d="M393 270C413 247 438 244 467 213V301C467 306 464 310 458 310H401C396 310 393 306 393 301Z" fill="#4076d3" opacity=".23"/>
    <rect x="413" y="149" width="34" height="5" rx="2.5" fill="#27354b"/>
  </g>
  <text x="320" y="407" fill="#737d8b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="21" text-anchor="middle">No product image</text>
</svg>
