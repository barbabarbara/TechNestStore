<!doctype html>
<html lang="en">

<head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page description -->
    <meta name="description" content="Explore smartphones, laptops, tablets,
      and mobile accessories at TechNest." />

    <!-- Browser tab title -->
    <title>Catalogue | TechNest</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="../css/style.css" />
</head>

<!-- Current page configuration -->

<body data-page="products" data-root="../">
    <!-- Skip navigation -->
    <a class="skip-link" href="#main">
        Skip to main content
    </a>

    <!-- Shared header -->
    <div id="site-header"></div>

    <!-- Main content -->
    <main id="main" class="shell">
        <section aria-labelledby="catalogue-heading">
            <h1 id="catalogue-heading">
                Product catalogue
            </h1>

            <p>
                Explore smartphones, laptops, tablets,
                and mobile accessories.
            </p>

            <!-- Catalogue controls: search, filters, and sorting. -->
            <div class="catalogue-toolbar">
                <div class="catalogue-control catalogue-search">
                    <label for="product-search">Search products</label>
                    <input id="product-search" type="search" placeholder="Search products..." autocomplete="off"
                        disabled />
                </div>

                <div class="catalogue-control">
                    <label for="category-filter">Category</label>
                    <select id="category-filter" disabled>
                        <option value="">All categories</option>
                        <option value="smartphones">Smartphones</option>
                        <option value="laptops">Laptops</option>
                        <option value="tablets">Tablets</option>
                        <option value="mobile-accessories">Mobile accessories</option>
                    </select>
                </div>

                <div class="catalogue-control">
                    <label for="brand-filter">Brand</label>
                    <select id="brand-filter" disabled>
                        <option value="">All brands</option>
                        <!-- JavaScript adds brands from the API here. -->
                    </select>
                </div>

                <div class="catalogue-control">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select" disabled>
                        <option value="default">Default order</option>
                        <option value="name-asc">Name: A to Z</option>
                        <option value="price-asc">Price: Low to high</option>
                        <option value="price-desc">Price: High to low</option>
                    </select>
                </div>

                <button id="clear-filters" class="catalogue-reset" type="button" disabled>
                    Clear filters
                </button>
            </div>

            <!-- Loading, result count, and error messages. -->
            <p id="catalogue-status" role="status">
                Loading products...
            </p>

            <!-- JavaScript inserts the products here -->
            <ul id="product-list" class="product-grid"></ul>

            <noscript>
                Enable JavaScript to view the product catalogue.
            </noscript>
        </section>
    </main>

    <!-- Shared footer -->
    <div id="site-footer"></div>

    <!-- Catalogue JavaScript module -->
    <script type="module" src="../js/products.js"></script>
</body>

</html>
