<!doctype html>
<html lang="en">

<head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page description -->
    <meta name="description" content="Review products in your TechNest shopping cart." />

    <!-- Browser tab title -->
    <title>Shopping Cart | TechNest</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="../css/style.css" />
</head>

<!-- Page configuration for the shared layout -->

<body data-page="cart" data-root="../">
    <!-- Accessibility: skip navigation -->
    <a class="skip-link" href="#main">
        Skip to main content
    </a>

    <!-- JavaScript generates the shared header -->
    <div id="site-header"></div>

    <!-- Main content -->
    <main id="main" class="shell">
        <section aria-labelledby="cart-heading">
            <h1 id="cart-heading">Shopping cart</h1>

            <p>
                Review your selected products before checkout.
            </p>

            <!-- Shopping cart functionality will be added later. -->
        </section>
    </main>

    <!-- JavaScript generates the shared footer -->
    <div id="site-footer"></div>

    <!-- Shared JavaScript layout -->
    <script type="module" src="../js/layout.js"></script>
</body>

</html>
